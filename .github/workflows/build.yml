name: Build DeluxeBounties

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'libs/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'libs/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeluxeBounties-1.0.0
          path: target/DeluxeBounties-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
